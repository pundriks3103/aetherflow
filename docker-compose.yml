name: aetherflow

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost", "2181"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [aetherflow-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks: [aetherflow-net]


  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8086:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: aetherflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [aetherflow-net]

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["mini", "-dir=/data"]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweedfs-data:/data
    networks:
      - aetherflow-net

  spark-master:
    image: aetherflow-spark:3.5.1-delta3.2.0
    build:
      context: .
      dockerfile: Dockerfile.spark
    hostname: spark-master
    user: "0:0"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    restart: unless-stopped
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - spark-logs:/opt/spark/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/spark-master/7077'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [aetherflow-net]
    environment:
      PYTHONPATH: "/opt/aetherflow/scripts:/opt/spark/python/lib/pyspark.zip:/opt/spark/python/lib/py4j-0.10.9.7-src.zip"
      AETHERFLOW_CONTEXT: compose
      AETHERFLOW_CONFIG: /opt/aetherflow/config/aetherflow.yml
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}

  spark-worker:
    image: aetherflow-spark:3.5.1-delta3.2.0
    build:
      context: .
      dockerfile: Dockerfile.spark
    hostname: spark-worker
    user: "0:0"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - spark-logs:/opt/spark/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/spark-master/7077'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [aetherflow-net]
    environment:
      PYTHONPATH: "/opt/aetherflow/scripts:/opt/spark/python/lib/pyspark.zip:/opt/spark/python/lib/py4j-0.10.9.7-src.zip"
      AETHERFLOW_CONTEXT: compose
      AETHERFLOW_CONFIG: /opt/aetherflow/config/aetherflow.yml
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}

  bronze-stream:
    image: aetherflow-spark:3.5.1-delta3.2.0
    build:
      context: .
      dockerfile: Dockerfile.spark
    user: "0:0"
    command:
      - /opt/spark/bin/spark-submit
      - /opt/aetherflow/scripts/bronze_stream.py
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -eo args | grep -q '[b]ronze_stream.py'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks: [aetherflow-net]
    environment:
      PYTHONPATH: "/opt/aetherflow/scripts:/opt/spark/python/lib/pyspark.zip:/opt/spark/python/lib/py4j-0.10.9.7-src.zip"
      AETHERFLOW_CONTEXT: compose
      AETHERFLOW_CONFIG: /opt/aetherflow/config/aetherflow.yml
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}

  dashboard:
    image: aetherflow-spark:3.5.1-delta3.2.0
    build:
      context: .
      dockerfile: Dockerfile.spark
    user: "0:0"
    command:
      - streamlit
      - run
      - /opt/aetherflow/scripts/crypto_dashboard.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - "--server.headless=true"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks: [aetherflow-net]
    environment:
      PYTHONPATH: "/opt/aetherflow/scripts:/opt/spark/python/lib/pyspark.zip:/opt/spark/python/lib/py4j-0.10.9.7-src.zip"
      AETHERFLOW_CONTEXT: compose
      AETHERFLOW_CONFIG: /opt/aetherflow/config/aetherflow.yml
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin-change-me}
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHERUSAGESTATS: "false"
      STREAMLIT_THEME_BASE: dark
      STREAMLIT_THEME_PRIMARYCOLOR: "#62e6c7"

  postgres:
    image: postgres:16.1
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aetherflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetherflow-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [aetherflow-net]

  airflow-init:
    image: apache/airflow:2.10.3
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-environment
      AETHERFLOW_CONTEXT: compose
      AETHERFLOW_CONFIG: /opt/aetherflow/config/aetherflow.yml
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-aetherflow}:${POSTGRES_PASSWORD:-aetherflow-local-only}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-JfJ7LQ3cJ1x8r2a5m7v9Q0p4s6t8u1w3x5y7z9A2B4c=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-dev-only-change-this-secret-key}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin-change-me}
      _AIRFLOW_WWW_USER_FIRSTNAME: AetherFlow
      _AIRFLOW_WWW_USER_LASTNAME: Admin
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    command: ["bash", "-c", "airflow db migrate && (airflow users create --username \"$${_AIRFLOW_WWW_USER_USERNAME}\" --password \"$${_AIRFLOW_WWW_USER_PASSWORD}\" --firstname \"$${_AIRFLOW_WWW_USER_FIRSTNAME}\" --lastname \"$${_AIRFLOW_WWW_USER_LASTNAME}\" --role Admin --email \"$${_AIRFLOW_WWW_USER_EMAIL}\" || airflow users list | grep -q \"$${_AIRFLOW_WWW_USER_USERNAME}\")"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    restart: "no"
    networks: [aetherflow-net]

  airflow-webserver:
    image: apache/airflow:2.10.3
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    command: webserver
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./scripts:/opt/aetherflow/scripts:ro
      - ./config:/opt/aetherflow/config:ro
      - ./airflow/logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [aetherflow-net]

  airflow-scheduler:
    image: apache/airflow:2.10.3
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    command: scheduler
    restart: unless-stopped
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./scripts:/opt/aetherflow/scripts:ro
      - ./config:/opt/aetherflow/config:ro
      - ./airflow/logs:/opt/airflow/logs
      - ${DOCKER_SOCKET_PATH:-/Users/pundriksharma/.docker/run/docker.sock}:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$(hostname)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [aetherflow-net]

networks:
  aetherflow-net:
    driver: bridge

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  seaweedfs-data:
  postgres-data:
  spark-logs:
